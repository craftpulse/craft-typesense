name: Tests

on:
  pull_request: null
  push:
    branches:
      - 5.x
  workflow_dispatch:

permissions:
  contents: read

env:
  CRAFT_DB_DRIVER: mysql
  CRAFT_DB_SERVER: 127.0.0.1
  CRAFT_DB_PORT: 3306
  CRAFT_DB_USER: root
  CRAFT_DB_PASSWORD: root
  CRAFT_SECURITY_KEY: ci-only-not-a-secret
  TYPESENSE_HOST: 127.0.0.1
  TYPESENSE_PORT: 8108
  TYPESENSE_PROTOCOL: http
  TYPESENSE_API_KEY: ci-not-a-real-secret

jobs:
  pest:
    name: Pest
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      # The Typesense image has no service-container equivalent of MySQL's
      # env-var-driven startup: `--data-dir` and `--api-key` are mandatory
      # CLI args with no environment-variable form, which the `services:`
      # block's `image`/`env`/`ports`/`options` keys cannot supply (there is
      # no `command:` key for service containers). A plain `docker run` step
      # is the standard way around that, not a workaround: it starts before
      # Composer/Pest need it and is reachable at TYPESENSE_HOST/PORT above.
      - name: Start Typesense
        run: |
          docker run -d --name typesense -p 8108:8108 typesense/typesense:28.0 \
            --data-dir /tmp --api-key="${{ env.TYPESENSE_API_KEY }}" --listen-port 8108
      - name: Wait for Typesense
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8108/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Typesense did not become healthy in time" >&2
          exit 1
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: 'ctype,curl,dom,gd,iconv,imagick,intl,json,mbstring,openssl,pcre,pdo,pdo_mysql,reflection,spl,zip'
          ini-values: post_max_size=256M, max_execution_time=180, memory_limit=512M
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-ansi --no-progress
      - name: Run Pest
        run: vendor/bin/pest
